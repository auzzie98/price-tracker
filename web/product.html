<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product - Price Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header-bar">
    <a class="header-logo" href="/">Price Tracker</a>
    <nav class="header-nav" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/gpus">GPUs</a>
      <a href="/cpus">CPUs</a>
      <a href="/ram">RAM</a>
      <a href="/methodology">Methodology</a>
      <a href="/upload-receipt">Upload a Price</a>
    </nav>
  </header>

  <main class="product-page">
    <section class="product-heading">
      <h1 id="product-title">Product</h1>
      <p id="product-meta"></p>
      <p class="mock-label">Real data, baseline Nov 23, 2026, Black Friday week snapshot.</p>
    </section>

    <section class="trend-section product-trend">
      <h2 class="trend-title">Trend</h2>
      <p class="trend-subtitle">Price in dollars for the selected model.</p>
      <div class="trend-legend">
        <div class="trend-model-name" id="trend-model-name">Product</div>
        <div class="trend-price-row">
          <span class="trend-price" id="trend-price">$579.99</span>
        </div>
      </div>
      <div class="trend-hover-date" id="trend-hover-date"></div>
      <canvas id="product-chart" width="1000" height="300"></canvas>
    </section>
    <div class="time-toggles">
      <button class="toggle" data-range="1d">1D</button>
      <button class="toggle" data-range="1w">1W</button>
      <button class="toggle active" data-range="1m">1M</button>
      <button class="toggle" data-range="1y">1Y</button>
      <button class="toggle" data-range="all">All</button>
    </div>

    <section class="retailer-section">
      <h3 class="section-header">Approved prices and retailers</h3>
      <p id="median-price-label" class="model-label"></p>
      <table class="retailer-table">
        <thead>
          <tr><th>Source</th><th>Date</th><th>Retailer</th><th>Price</th><th>In stock</th><th>Link</th></tr>
        </thead>
        <tbody id="retailer-rows"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/js/chart.js"></script>
  <script>
    var pathParts = window.location.pathname.split('/').filter(Boolean);
    var productId = pathParts[pathParts.length - 1] || 'asus-dual-rtx5070-12g';
    var selectedRange = '1m';
    var liveValues = null;
    var liveDates = null;

    fetch('/api/products/' + encodeURIComponent(productId) + '/history')
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        if (!data || !data.history.length) {
          document.getElementById('trend-price').textContent = 'No data yet';
          document.getElementById('trend-model-name').textContent = data && data.model ? data.model.model : 'Product';
          liveValues = [];
          liveDates = [];
          drawProductChart();
          return;
        }
        liveValues = data.history.map(function(point) { return point.median_price_dollars; });
        liveDates = data.history.map(function(point) { return point.date; });
        document.title = data.model.model + ' - Price Tracker';
        document.getElementById('product-title').textContent = data.model.model;
        document.getElementById('product-meta').textContent =
          'MPN ' + data.model.mpn + ' | ' + data.model.category;
        drawProductChart();
      })
      .catch(function() {});

    fetch('/api/catalog')
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        if (!data) return;
        var catalogProduct = data.products.find(function(item) { return item.id === productId; });
        if (!catalogProduct) return;
        document.title = catalogProduct.model + ' - Price Tracker';
        document.getElementById('product-title').textContent = catalogProduct.model;
        document.getElementById('product-meta').textContent =
          'MPN ' + catalogProduct.mpn + ' | ' + catalogProduct.category;
      })
      .catch(function() {});

    function drawProductChart() {
      var canvas = document.getElementById('product-chart');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var width = Math.max(1, canvas.clientWidth || canvas.offsetWidth);
      var height = 300;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      var values = liveValues || [];
      if (!values.length) {
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('No data yet', width / 2, height / 2);
        return;
      }
      if (window.PriceTrackerChart) {
        window.PriceTrackerChart.draw(
          canvas,
          values,
          selectedRange,
          document.getElementById('trend-price'),
          document.getElementById('trend-hover-date'),
          liveDates
        );
      }
    }

    var retailerRows = document.getElementById('retailer-rows');
    Promise.all([
      fetch('/api/catalog'),
      fetch('/api/products/' + encodeURIComponent(productId) + '/retailer-prices'),
      fetch('/api/products/' + encodeURIComponent(productId) + '/history')
    ]).then(function(responses) {
      return Promise.all(responses.map(function(response) {
        return response.ok ? response.json() : null;
      }));
    }).then(function(results) {
      var catalogData = results[0];
      var retailerData = results[1];
      var historyData = results[2];
      if (!catalogData || !retailerData) return;
      var catalogProduct = catalogData.products.find(function(item) {
        return item.id === productId;
      });
      if (!catalogProduct) return;
      var retailerPrices = retailerData.retailer_prices || [];
      retailerPrices.sort(function(a, b) {
        return new Date(a.observed_at) - new Date(b.observed_at);
      });

      if (!retailerPrices.length) {
        retailerRows.innerHTML = '<tr><td colspan="6">No clean retailer data yet.</td></tr>';
        document.getElementById('median-price-label').textContent = 'Median price: No data yet';
        return;
      }

      var html = '';
      retailerPrices.forEach(function(row) {
        var date = new Date(row.observed_at);
        var dateLabel = row.source_label === 'Baseline'
          ? 'Nov 23, 2026'
          : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        var sourceLabel = row.source_label === 'Baseline' ? 'Baseline' : 'Approved';
        var link = row.product_url
          ? '<a href="' + row.product_url + '" target="_blank" rel="noopener">View exact product</a>'
          : 'No exact page recorded';
        html += '<tr>' +
          '<td>' + sourceLabel + '</td>' +
          '<td>' + dateLabel + '</td>' +
          '<td>' + row.retailer_name + '</td>' +
          '<td>$' + row.price_dollars.toFixed(2) + '</td>' +
          '<td><span class="stock-yes">' + (row.in_stock ? 'In stock' : 'Out of stock') + '</span></td>' +
          '<td>' + link + '</td>' +
          '</tr>';
      });
      retailerRows.innerHTML = html;
      if (historyData && historyData.history && historyData.history.length) {
        var latest = historyData.history[historyData.history.length - 1];
        document.getElementById('median-price-label').textContent =
          'Median price: $' + latest.median_price_dollars.toFixed(2);
      } else {
        document.getElementById('median-price-label').textContent =
          'Median price: $' + (catalogProduct.price_cents / 100).toFixed(2);
      }
    }).catch(function() {});

    document.querySelectorAll('.time-toggles .toggle').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelector('.time-toggles .toggle.active').classList.remove('active');
        button.classList.add('active');
        selectedRange = button.dataset.range;
        drawProductChart();
      });
    });

    drawProductChart();
    window.addEventListener('resize', drawProductChart);
  </script>
</body>
</html>
