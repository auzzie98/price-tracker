<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product - Price Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header-bar">
    <a class="header-logo" href="/">Price Tracker</a>
    <nav class="header-nav" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/gpus">GPUs</a>
      <a href="/cpus">CPUs</a>
      <a href="/ram">RAM</a>
      <a href="/methodology">Methodology</a>
      <a href="/upload-receipt">Upload a Price</a>
    </nav>
  </header>

  <main class="product-page">
    <section class="product-heading">
      <h1 id="product-title">Product</h1>
      <p id="product-meta"></p>
      <p class="mock-label">Real data, baseline Nov 23, 2026, Black Friday week snapshot.</p>
    </section>

    <section class="trend-section product-trend">
      <h2 class="trend-title">Trend</h2>
      <p class="trend-subtitle">Price in dollars for the selected model.</p>
      <div class="trend-legend">
        <div class="trend-model-name" id="trend-model-name">Product</div>
        <div class="trend-price-row">
          <span class="trend-price" id="trend-price">$579.99</span>
        </div>
      </div>
      <div class="trend-hover-date" id="trend-hover-date"></div>
      <canvas id="product-chart" width="1000" height="300"></canvas>
    </section>
    <div class="time-toggles">
      <button class="toggle" data-range="1d">1D</button>
      <button class="toggle" data-range="1w">1W</button>
      <button class="toggle active" data-range="1m">1M</button>
      <button class="toggle" data-range="1y">1Y</button>
      <button class="toggle" data-range="all">All</button>
    </div>

    <section class="retailer-section">
      <h3 class="section-header">Retailers</h3>
      <table class="retailer-table">
        <thead>
          <tr><th>Retailer</th><th>Price</th><th>In stock</th><th>Link</th></tr>
        </thead>
        <tbody id="retailer-rows"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/js/chart.js"></script>
  <script>
    var pathParts = window.location.pathname.split('/').filter(Boolean);
    var productId = pathParts[pathParts.length - 1] || 'asus-dual-rtx5070-12g';
    var selectedRange = '1m';
    var liveValues = null;
    var liveDates = null;

    fetch('/api/products/' + encodeURIComponent(productId) + '/history')
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        if (!data || !data.history.length) {
          document.getElementById('trend-price').textContent = 'No data yet';
          document.getElementById('trend-model-name').textContent = data && data.model ? data.model.model : 'Product';
          liveValues = [];
          liveDates = [];
          drawProductChart();
          return;
        }
        liveValues = data.history.map(function(point) { return point.median_price_dollars; });
        liveDates = data.history.map(function(point) { return point.date; });
        document.title = data.model.model + ' - Price Tracker';
        document.getElementById('product-title').textContent = data.model.model;
        document.getElementById('product-meta').textContent =
          'MPN ' + data.model.mpn + ' | ' + data.model.category;
        drawProductChart();
      })
      .catch(function() {});

    fetch('/api/catalog')
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        if (!data) return;
        var catalogProduct = data.products.find(function(item) { return item.id === productId; });
        if (!catalogProduct) return;
        document.title = catalogProduct.model + ' - Price Tracker';
        document.getElementById('product-title').textContent = catalogProduct.model;
        document.getElementById('product-meta').textContent =
          'MPN ' + catalogProduct.mpn + ' | ' + catalogProduct.category;
      })
      .catch(function() {});

    function drawProductChart() {
      var canvas = document.getElementById('product-chart');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var width = Math.max(1, canvas.clientWidth || canvas.offsetWidth);
      var height = 300;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      var values = liveValues || [];
      if (!values.length) {
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('No data yet', width / 2, height / 2);
        return;
      }
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      var padding = (max - min || Math.abs(max) * 0.1) * 0.05;
      var chartMin = min - padding;
      var chartMax = max + padding;
      var plotWidth = width - 72;
      var plotHeight = height - 44;
      var start = values[0];

      function x(index) { return index / (values.length - 1) * plotWidth; }
      function y(value) { return 12 + (chartMax - value) / (chartMax - chartMin) * plotHeight; }

      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (var i = 0; i < values.length - 1; i++) {
        var endCents = Math.round(values[i + 1] * 100);
        var startCents = Math.round(start * 100);
        ctx.beginPath();
        ctx.moveTo(x(i), y(values[i]));
        ctx.lineTo(x(i + 1), y(values[i + 1]));
        ctx.strokeStyle = endCents > startCents ? '#FF5000' : '#00C805';
        ctx.stroke();
      }

      ctx.fillStyle = '#9CA3AF';
      ctx.font = '12px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('$' + chartMax.toFixed(2), width - 62, y(chartMax));
      ctx.fillText('$' + ((chartMin + chartMax) / 2).toFixed(2), width - 62, height / 2);
      ctx.fillText('$' + chartMin.toFixed(2), width - 62, y(chartMin));

      var labels = selectedRange === '1d'
        ? ['9 AM', '12 PM', '3 PM', '6 PM']
        : selectedRange === '1w'
          ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
          : selectedRange === '1m'
            ? ['Nov 1', 'Nov 8', 'Nov 15', 'Nov 22']
            : ['Jan', 'Mar', 'May', 'Jul', 'Sep', 'Nov'];
      ctx.font = '11px Arial';
      ctx.textBaseline = 'middle';
      labels.forEach(function(label, index) {
        var point = labels.length === 1 ? 0 : index / (labels.length - 1) * (values.length - 1);
        ctx.textAlign = index === 0 ? 'left' : index === labels.length - 1 ? 'right' : 'center';
        ctx.fillText(label, x(point), height - 12);
      });
      if (window.PriceTrackerChart) {
        window.PriceTrackerChart.draw(
          canvas,
          values,
          selectedRange,
          document.getElementById('trend-price'),
          document.getElementById('trend-hover-date'),
          liveDates
        );
      }
    }

    var retailerRows = document.getElementById('retailer-rows');
    // Fetch retailer prices and catalog data
    Promise.all([
      fetch('/api/catalog'),
      fetch('/api/products/' + encodeURIComponent(productId) + '/retailer-prices')
    ]).then(function(responses) {
      return Promise.all(responses.map(function(r) { return r.ok ? r.json() : null; }));
    }).then(function([catalogData, retailerData]) {
      if (!catalogData || !retailerData) return;
      var catalogProducts = catalogData.products;
      var catalogProduct = catalogProducts.find(function(item) { return item.id === productId; });
      if (!catalogProduct) return;

      // Build a map of model_id -> retailer prices from the new API
      var retailerPrices = retailerData.retailer_prices || [];

      // Build the current prices table
      var html = '';
      // Show all retailer prices
      if (retailerPrices.length > 0) {
        retailerPrices.forEach(function(rp) {
          var priceDisplay = rp.price_dollars !== null ? '$' + rp.price_dollars.toFixed(2) : 'No price';
          var stockDisplay = rp.in_stock ? 'In stock' : 'Out of stock';
          var retailerLink = rp.product_url ? '<a href="' + rp.product_url + '" target="_blank" class="retailer-link">' + rp.retailer_name + '</a>' : rp.retailer_name;
          html += '<tr><td>' + retailerLink + '</td><td>' + priceDisplay + '</td><td>' + stockDisplay + '</td><td>Nov 23, 2026</td></tr>';
        });
        // Show median price separately at the bottom
        html += '<tr class="median-row"><td colspan="4"><strong>Median price:</strong> $' + (catalogProduct.price_cents / 100).toFixed(2) + '</td></tr>';
      } else if (catalogProduct.price_cents !== null) {
        // Fallback: show just the median price
        html = '<tr><td colspan="4">No retailer price data available yet.</td></tr>';
        html += '<tr class="median-row"><td colspan="4"><strong>Median price:</strong> $' + (catalogProduct.price_cents / 100).toFixed(2) + '</td></tr>';
      } else {
        html = '<tr><td colspan="4">No clean retailer data yet.</td></tr>';
      }
      retailerRows.innerHTML = html;
    })
    .catch(function() {});

    document.querySelectorAll('.time-toggles .toggle').forEach(function(button) {
      button.addEventListener('click', function() {
        document.querySelector('.time-toggles .toggle.active').classList.remove('active');
        button.classList.add('active');
        selectedRange = button.dataset.range;
        drawProductChart();
      });
    });

    drawProductChart();
    window.addEventListener('resize', drawProductChart);
  </script>
</body>
</html>
